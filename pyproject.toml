[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "stepwise-selectors"
version = "0.1.0"
description = "Lightweight Gram-based linear-model selection routines."
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["numpy"]

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools.packages.find]
include = ["selection"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "unit: fast deterministic checks for isolated components",
    "integration: cross-module and workflow tests",
    "property: randomized/property-based behavioral checks",
    "regression: golden/oracle and previously failing-case coverage",
]
